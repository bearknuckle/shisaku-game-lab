<style>
:root{--field:#1d5a37;--field2:#164a2c;--chalk:#f6f1e3;--paper:#fffaf0;--ink:#1e2420;--mute:#6b6f68;--gold:#f0bd3f;--red:#d0473f;--blue:#3466c9;--line:#e3dcc8}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Zen Kaku Gothic New",system-ui,sans-serif;color:var(--ink);background:repeating-linear-gradient(90deg,var(--field) 0 48px,var(--field2) 48px 96px);min-height:100vh}
#app{max-width:600px;margin:0 auto;padding:12px 12px 50px}
h1,h2,h3{margin:0}
.panel{background:var(--paper);border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.title{color:var(--chalk);text-align:center;padding:26px 8px 6px}
.title h1{font-size:34px;font-weight:900;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.title .sub{font-size:13px;opacity:.9;margin-top:6px}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--gold);color:var(--ink);font-weight:700}
.btn{appearance:none;border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;background:var(--red);color:#fff;box-shadow:0 3px 0 #8c2b25}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #8c2b25}
.btn.blue{background:var(--blue);box-shadow:0 3px 0 #1f448c}
.btn.wide{width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.top{color:var(--chalk);display:flex;justify-content:space-between;align-items:center;font-weight:700}
.top .series{font-family:"DotGothic16",monospace;font-size:18px}
.sec{font-size:15px;font-weight:900}
.mute{color:var(--mute);font-size:13px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:8px}
.card{position:relative;background:#fff;border:2px solid var(--line);border-radius:10px;padding:8px 6px 6px;text-align:center;font-size:12px;min-height:96px;display:flex;flex-direction:column}
.card.click{cursor:pointer}
.card.click:hover{border-color:#bdb49c}
.card.sel{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue) inset}
.card.off{opacity:.35;cursor:not-allowed}
.card .kind{position:absolute;top:5px;left:5px;font-size:11px;font-weight:900;color:#fff;border-radius:5px;padding:1px 5px}
.card.bat .kind{background:var(--red)}
.card.pit .kind{background:var(--blue)}
.card .num{font-family:"DotGothic16",monospace;font-size:32px;line-height:1;margin-top:12px}
.card .nm{font-weight:700;font-size:13px;margin-top:3px}
.card .ty{font-size:11px;color:var(--blue);font-weight:700}
.card .st{position:absolute;top:5px;right:5px;font-size:10px;font-weight:700;padding:1px 4px;border-radius:4px;background:#333;color:#fff}
.card .tired{color:var(--red);font-size:12px}
.board{font-family:"DotGothic16",monospace;background:#16251c;color:#f8f3dc;border-radius:10px;padding:8px 6px;overflow-x:auto}
.board table{border-collapse:collapse;width:100%}
.board th{color:#a9b9ab;font-weight:400;font-size:12px;padding:2px}
.board td{text-align:center;font-size:18px;padding:3px 2px;border-top:1px solid #2c3f32;min-width:22px}
.board td.tn{text-align:left;font-family:"Zen Kaku Gothic New";font-size:12px;font-weight:700;white-space:nowrap;padding-right:6px}
.board td.tot{color:var(--gold);font-size:22px}
.board td.now{background:#2b4a36}
.situ{margin-top:8px;font-weight:900;font-size:15px;text-align:center}
.bats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.bat{background:#fff;border:2px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;font-size:12px;min-height:92px}
.bat .die{width:38px;height:38px;margin:6px auto 2px;border-radius:8px;border:2px dashed #ccc;display:flex;align-items:center;justify-content:center;font-family:"DotGothic16",monospace;font-size:22px}
.bat.hit{border-color:#b38512;background:#fff6d6}
.bat.hit .die{background:var(--gold);border:2px solid #b38512}
.bat.out .die{background:#eee;border:2px solid #bbb;color:#888}
.bat.roll .die{animation:sp .25s linear infinite}
@keyframes sp{50%{transform:rotate(90deg) scale(.9)}}
.bat .res{font-weight:900;font-size:13px;margin-top:2px}
.bat .hpct{font-weight:900;font-size:12px;color:#b38512;margin-top:2px}
.call{margin-top:10px;background:#16251c;color:#f8f3dc;border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.7;min-height:64px}
.call div:first-child{font-weight:700;color:var(--gold)}
.read{border:3px solid var(--gold);border-radius:12px;padding:12px;background:#fffbe9;margin-top:10px}
.read h3{font-size:17px}
.reveal{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;text-align:center;margin-top:8px;font-weight:900}
.reveal .c{background:#fff;border:2px solid var(--line);border-radius:10px;padding:8px 4px}
.big{text-align:center;font-size:30px;font-weight:900;margin:4px 0}
.rules{font-size:13px;line-height:1.75}
.rules ul{margin:6px 0;padding-left:18px}
details summary{cursor:pointer;font-weight:700}
.log{font-size:13px;line-height:1.7;margin:8px 0 0;padding-left:18px}
.speed{font-size:12px;color:var(--chalk);text-align:right;margin-top:4px}
.speed button{background:none;border:1px solid rgba(255,255,255,.4);color:var(--chalk);border-radius:6px;font:inherit;padding:2px 8px;cursor:pointer}
.back{text-align:center;margin:18px 0 0;font-size:13px}.back a{color:var(--chalk)}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ===== ペナント・オーナーズ v0.5（いちばんシンプル版） =====
// アナログ版の内容物：選手カード10枚（打者7・投手3）、直球・変化球カード2枚×2人、サイコロ1個、スコア表
const rnd=n=>Math.floor(Math.random()*n);
const d6=()=>1+rnd(6);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
const $app=document.getElementById('app');

const BAT_VALS=[3,3,2,2,2,1,1], PIT_VALS=[8,7,6];   // 投手の数字＝ヒットに必要な「出目＋打力」
const NEED_B=3, NEED_P=1, GAMES=3, LAST=3, SAFE_INN=9;
const PT={c:'直球',h:'変化球'};
// ヒット率（％）：出目(1〜6)＋打力v が投手の数字need以上になる確率を、判定式そのままに計算
const hitPct=(v,need)=>{const k=need-v;return k<=1?100:k>=7?0:Math.round((7-k)/6*100);};
const NAMES=['浅倉','石動','宇佐美','江口','大槻','柏木','桐生','久住','小野寺','榊','篠原','白石','須藤','瀬川','高峰','千早','津田','遠野','長嶺','西園','野々村','橋爪','日向','藤堂','真柴','三雲','村瀬','望月','矢吹','結城'];
let S=null, uid=0, SPEED=600;

const T=i=>S.teams[i];
const tname=i=>`<span class="dot" style="background:${T(i).color}"></span>${T(i).name}`;
const bats=i=>T(i).roster.filter(p=>p.type==='B');
const pitcher=i=>T(i).roster.find(p=>p.type==='P');
const wins=i=>S.results.filter(r=>r===i).length;

// ===== ドラフト：先手が1枚、そのあと2枚ずつ交互（1・2・2・2・1） =====
function newGame(){
  uid=0; const names=shuffle(NAMES.slice());
  const pool=[...PIT_VALS.map(v=>({type:'P',val:v})),...BAT_VALS.map(v=>({type:'B',val:v}))].map(p=>({...p,id:++uid,name:names.pop()}));
  const first=rnd(2);
  S={phase:'draft',teams:[{name:'ホームスターズ',color:'#d0473f',roster:[]},{name:'湾岸ドルフィンズ',color:'#2f7fd1',roster:[]}],
     pool,turn:first,first,pk:0,log:[],results:[],gameNo:0};
  cpuDraft(); render();
}
const full=i=>T(i).roster.length>=NEED_B+NEED_P;
function canTake(i,p){return p.type==='B'?bats(i).length<NEED_B:!pitcher(i);}
function take(i,p){
  S.pool.splice(S.pool.indexOf(p),1);T(i).roster.push(p);
  S.log.push(`${i===0?'あなた':T(1).name}：${p.name}（${p.type==='B'?'打力':'投手'}${p.val}）`);
  S.pk++; S.turn=[0,1,1,0,0,1,1,0][S.pk]===0?S.first:1-S.first;
  if(full(0)&&full(1)) S.phase='drafted';
}
function cpuDraft(){
  while(S.phase==='draft'&&S.turn===1){
    const sc=p=>p.type==='B'?p.val:(p.val-5)+0.5;
    take(1,S.pool.filter(p=>canTake(1,p)).sort((a,b)=>sc(b)-sc(a))[0]);
  }
}
function humanTake(id){const p=S.pool.find(x=>x.id===id);if(S.phase!=='draft'||S.turn!==0||!p||!canTake(0,p))return;take(0,p);cpuDraft();render();}

// ===== 試合 =====
function startGame(){
  S.gameNo++;
  const home=S.gameNo%2===1?0:1;           // 第1・3戦はあなたが後攻
  S.G={home,away:1-home,inning:1,half:0,runs:[[],[]],bats:[],call:['プレイボール！'],need:null,read:null,over:false,winner:undefined,walkoff:false};
  S.phase='game'; render(); setTimeout(nextHalf,SPEED);
}
const tot=i=>S.G.runs[i].reduce((s,v)=>s+(v||0),0);
const atkOf=()=>S.G.half===0?S.G.away:S.G.home;
const halfName=()=>`${S.G.inning}回${S.G.half?'裏':'表'}`;

function nextHalf(){
  const G=S.G;
  if(G.inning>=LAST){G.need='read';G.read=null;G.bats=[];render();return;}
  runHalf(0);
}
function choose(c){
  const G=S.G; if(G.need!=='read') return;
  const atk=atkOf(), cpu=rnd(2)?'c':'h';
  const aim=atk===0?c:cpu, pitch=atk===0?cpu:c, hit=aim===pitch;
  G.read={aim,pitch,hit,atk}; G.need=null;
  G.call=[`${halfName()} 読み合い：${PT[aim]}狙い × ${PT[pitch]}`,hit?`読み的中！ ${T(atk).name}の打者は全員打力＋2`:`読み外れ。打力はそのまま`];
  render();
  setTimeout(()=>runHalf(hit?2:0),SPEED*1.6);
}
function runHalf(bmod){
  const G=S.G, atk=atkOf(), P=pitcher(1-atk), need=P.val;
  G.runs[atk][G.inning-1]=0;
  G.bats=bats(atk).map(p=>({p,v:p.val+bmod,d:null,state:'',need}));
  const head=`${halfName()}　${T(atk).name}の攻撃`;
  G.call=[head,`投手 ${P.name} → 出目＋打力が${need}以上でヒット`];
  render();
  let k=0;
  const step=()=>{
    if(k>=G.bats.length){setTimeout(endHalf,SPEED);return;}
    const b=G.bats[k]; b.state='roll'; render();
    setTimeout(()=>{
      b.d=d6(); const hit=b.d+b.v>=need; b.state=hit?'hit':'out';
      if(hit)G.runs[atk][G.inning-1]++;
      const tie=tot(G.home)===tot(G.away);
      G.call=[head,`${b.p.name}：出目${b.d}＋打力${b.v}＝${b.d+b.v} → ${hit?'ヒット！ 1点':'凡退'}${hit&&G.half===1&&G.inning>=LAST&&tie?'　同点！':''}`];
      if(hit&&G.half===1&&G.inning>=LAST&&tot(G.home)>tot(G.away)){G.walkoff=true;render();setTimeout(()=>finish(G.home),SPEED*1.4);return;}
      render(); k++; setTimeout(step,SPEED);
    },SPEED*0.7);
  };
  setTimeout(step,SPEED);
}
function endHalf(){
  const G=S.G;
  if(G.half===0){
    if(G.inning>=LAST&&tot(G.home)>tot(G.away)){finish(G.home);return;}
    G.half=1;
  }else{
    if(G.inning>=LAST&&tot(G.home)!==tot(G.away)){finish(tot(G.home)>tot(G.away)?G.home:G.away);return;}
    if(G.inning>=SAFE_INN){finish(null);return;}
    G.inning++;G.half=0;
  }
  G.bats=[];
  G.call=[halfName()+(G.inning>LAST?'（延長）':G.inning===LAST?'（最終回）':''),G.inning>=LAST?'読み合いの準備…':'次の攻撃へ'];
  render();
  setTimeout(nextHalf,SPEED*1.2);
}
function finish(w){
  const G=S.G; G.over=true; G.winner=w; G.need=null;
  S.results.push(w);
  G.call=[w===null?'引き分け':G.walkoff?`サヨナラ！ ${T(w).name}の勝利`:`試合終了 ${T(w).name}の勝利`,`${T(G.away).name} ${tot(G.away)} − ${tot(G.home)} ${T(G.home).name}`];
  render();
}
const seriesOver=()=>wins(0)>=2||wins(1)>=2||S.gameNo>=GAMES;

// ===== 描画 =====
function card(p,o={}){
  const cls=['card',p.type==='B'?'bat':'pit',o.click?'click':'',o.off?'off':''].join(' ');
  return `<div class="${cls}" ${o.click?`onclick="${o.click}"`:''}><span class="kind">${p.type==='B'?'打':'投'}</span>
  <div class="num">${p.val}</div><div class="nm">${p.name}</div><div class="ty">${p.type==='B'?'打力':'これ以上でヒット'}</div></div>`;
}
function board(){
  const G=S.G, n=Math.max(LAST,G.inning), cols=[...Array(n)].map((_,i)=>i+1);
  const row=i=>`<tr><td class="tn">${tname(i)}</td>${cols.map(c=>{
    const v=G.runs[i][c-1]; const now=!G.over&&c===G.inning&&atkOf()===i;
    const skip=G.over&&i===G.home&&v===undefined&&c===n&&G.winner===G.home&&!G.walkoff;
    return `<td class="${now?'now':''}">${v===undefined?(skip?'x':''):v}</td>`;}).join('')}<td class="tot">${tot(i)}</td></tr>`;
  return `<div class="board"><table><tr><th></th>${cols.map(c=>`<th>${c}</th>`).join('')}<th>計</th></tr>${row(G.away)}${row(G.home)}</table></div>`;
}
const BACK='<p class="back"><a href="../">← 試作ゲームラボに戻る</a> ・ ペナント・オーナーズ v0.5</p>';
function rules(open){
  return `<details class="panel" ${open?'open':''}><summary>ルール</summary><div class="rules">
  <ul>
  <li><b>ドラフト</b>：先手が1枚、そのあとは2枚ずつ交互に取って、打者3人と投手1人をそろえる。</li>
  <li><b>打つ</b>：打者が1人ずつサイコロを振る。<b>出目＋打力が相手投手の数字以上</b>ならヒットで1点。</li>
  <li><b>3回まで</b>。最終回は攻める側が「直球／変化球」を狙い、守る側が投げる球を選んで同時に出す。<b>読みが当たれば打者全員＋2</b>。</li>
  <li>同点なら延長（読み合いつき）。後攻が逆転したらその場でサヨナラ。</li>
  <li><b>ヒット率</b>：対決中は各打者のヒット率（％）を表示。最終回の読み合いでは、読みが当たった場合の率もあわせて表示。</li>
  <li><b>3試合して2勝した方の優勝</b>。</li>
  </ul>
  <p class="mute">アナログ版の内容物：選手カード10枚、直球・変化球カード2枚×2人、サイコロ1個、スコア表。</p>
  </div></details>`;
}
const topbar=()=>`<div class="top"><span>第${Math.max(1,S.gameNo)}戦</span><span class="series">あなた ${wins(0)}−${wins(1)} 相手</span></div>`;

function render(){
  if(!S){
    $app.innerHTML=`<div class="title"><h1>ペナント・オーナーズ</h1>
    <div class="sub">選手を取り合って、3人で打つ。<br>最終回は「直球か、変化球か」。</div></div>
    <div class="panel"><button class="btn wide" onclick="newGame()">ドラフトをはじめる</button></div>${rules(true)}${BACK}`;return;
  }
  let h='';
  if(S.phase==='draft'||S.phase==='drafted'){
    const mine=S.phase==='draft'&&S.turn===0;
    h+=`<div class="title" style="padding-top:8px"><h1 style="font-size:24px">ドラフト</h1><div class="sub">${S.first===0?'あなた':'相手'}から（1枚→2枚ずつ交互）。打者3人・投手1人をそろえる</div></div>
    <div class="panel"><div class="sec">${S.phase==='drafted'?'ドラフト終了':mine?'あなたの番です（カードをタップ）':'相手が指名中…'}</div>
    <div class="cards">${S.pool.map(p=>card(p,{click:mine&&canTake(0,p)?`humanTake(${p.id})`:'',off:mine&&!canTake(0,p)})).join('')}</div>
    ${S.log.length?`<ul class="log">${S.log.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}
    ${S.phase==='drafted'?`<div style="margin-top:12px"><button class="btn wide" onclick="startGame()">第1戦 プレイボール！</button></div>`:''}</div>
    <div class="panel"><div class="sec">あなたのチーム</div><div class="cards">${T(0).roster.map(p=>card(p)).join('')}</div>
    <div class="sec" style="margin-top:12px">${T(1).name}</div><div class="cards">${T(1).roster.map(p=>card(p)).join('')}</div></div>`;
  }
  else if(S.phase==='game'){
    const G=S.G;
    h+=topbar()+`<div class="speed"><button onclick="SPEED=SPEED>200?120:600;render()">${SPEED>200?'▶▶ はやく':'▶ ふつう'}</button></div>
    <div class="panel">${board()}`;
    if(G.over){
      const w=G.winner;
      h+=`<div class="big" style="color:${w===0?'var(--red)':'var(--ink)'}">${w===null?'引き分け':w===0?(G.walkoff?'サヨナラ勝ち！':'勝利！'):(G.walkoff?'サヨナラ負け…':'敗戦…')}</div>
      <div class="call">${G.call.map(x=>`<div>${x}</div>`).join('')}</div>
      <div style="margin-top:12px">${seriesOver()?`<button class="btn wide" onclick="S.phase='end';render()">シリーズの結果へ</button>`:`<button class="btn wide" onclick="startGame()">第${S.gameNo+1}戦 プレイボール！</button>`}</div>`;
    }else if(G.need==='read'){
      const me=atkOf()===0;
      h+=`<div class="situ">${halfName()}${G.inning>LAST?'（延長）':'（最終回）'}　${T(G.away).name.slice(0,3)} ${tot(G.away)} − ${tot(G.home)} ${T(G.home).name.slice(0,3)}</div>
      <div class="read"><h3>${me?'どっちを狙う？':'どっちで勝負する？'}</h3>
      <div class="mute" style="margin-top:4px">${me?'当たれば、あなたの打者全員が打力＋2。':'読まれたら、相手の打者全員が打力＋2。'}</div>
      <div class="mute" style="margin-top:4px">この回の打者のヒット率：${bats(atkOf()).map(p=>hitPct(p.val,pitcher(1-atkOf()).val)+'%').join(' ／ ')} → 読みが当たれば ${bats(atkOf()).map(p=>hitPct(p.val+2,pitcher(1-atkOf()).val)+'%').join(' ／ ')}</div>
      <div class="two"><button class="btn" onclick="choose('c')">${me?'直球を狙う':'直球で勝負'}</button><button class="btn blue" onclick="choose('h')">${me?'変化球を狙う':'変化球で勝負'}</button></div></div>`;
    }else{
      if(G.read&&G.inning>=LAST){
        const r=G.read;
        h+=`<div class="reveal"><div class="c"><div class="mute">${r.atk===0?'あなた':'相手'}の狙い</div>${PT[r.aim]}</div><div style="font-size:20px">${r.hit?'⭕':'❌'}</div><div class="c"><div class="mute">${r.atk===0?'相手':'あなた'}の球</div>${PT[r.pitch]}</div></div>`;
      }
      if(G.bats.length){
        h+=`<div class="bats">${G.bats.map(b=>`<div class="bat ${b.state}"><div style="font-weight:700">${b.p.name}</div><div class="mute">打力${b.v}</div><div class="hpct">ヒット率 ${hitPct(b.v,b.need)}%</div><div class="die">${b.state==='roll'?'?':(b.d??'')}</div><div class="res">${b.state==='hit'?'ヒット':b.state==='out'?'凡退':''}</div></div>`).join('')}</div>`;
      }
      h+=`<div class="call">${G.call.map(x=>`<div>${x}</div>`).join('')}</div>`;
    }
    h+=`</div>`;
  }
  else if(S.phase==='end'){
    const a=wins(0),b=wins(1);
    h+=`<div class="title"><span class="badge">シリーズ終了</span><h1 style="margin-top:12px">${a>b?'🏆 優勝！':a<b?'準優勝':'引き分け'}</h1>
    <div class="sub">${T(0).name} ${a}勝 − ${b}勝 ${T(1).name}</div></div>
    <div class="panel"><div class="mute">${S.results.map((r,i)=>`第${i+1}戦：${r===null?'引き分け':r===0?'○ 勝ち':'● 負け'}`).join('<br>')}</div>
    <div style="margin-top:12px"><button class="btn wide" onclick="newGame()">もう一度ドラフトから</button></div></div>`;
    $app.innerHTML=h+BACK;window.scrollTo(0,0);return;
  }
  $app.innerHTML=h+rules(false)+BACK;
}
render();
</script>
</body>
</html>
